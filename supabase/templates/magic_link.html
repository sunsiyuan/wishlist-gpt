<!-- Local dev email template for OTP sign-in. The app verifies a 6-digit code
     (supabase.auth.verifyOtp type: "email"), so we render {{ .Token }} — the default
     Supabase template only shows the link. Emails are caught by Mailpit (127.0.0.1:54324). -->
<h2>Sign in to WishlistGPT</h2>
<p>Your verification code:</p>
<p style="font-size:28px;font-weight:700;letter-spacing:6px;font-family:monospace">{{ .Token }}</p>
<p style="color:#666">Or sign in with this link: <a href="{{ .ConfirmationURL }}">Sign in</a></p>
