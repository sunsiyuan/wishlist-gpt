openapi: 3.1.0
info:
  title: WishlistGPT Actions API
  version: 0.1.0
servers:
  - url: __BASE_URL__

components:
  schemas:
    MeResponse:
      type: object
      properties:
        user_id:
          type: string
        client_id:
          type: string
      required:
        - user_id
        - client_id
    Item:
      type: object
      properties:
        id:
          type: string
        url_original:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        display_cover_image_url:
          type: string
          nullable: true
        display_product_title:
          type: string
          nullable: true
        display_merchant_logo_url:
          type: string
          nullable: true
        display_merchant_domain:
          type: string
          nullable: true
        display_price_amount_minor:
          type: integer
          nullable: true
        display_currency:
          type: string
          nullable: true
        display_price_text:
          type: string
          nullable: true
        display_price_updated_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - url_original
        - created_at
        - updated_at
    CreateItemRequest:
      type: object
      properties:
        url:
          type: string
        display_cover_image_url:
          type: string
        display_product_title:
          type: string
        display_merchant_logo_url:
          type: string
        display_merchant_domain:
          type: string
        display_price_amount_minor:
          type: integer
        display_currency:
          type: string
        display_price_text:
          type: string
      required:
        - url
    CreateItemResponse:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/Item"
      required:
        - item
    ListItemsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
      required:
        - items
    FeedbackContext:
      type: object
      properties:
        page:
          type: string
        share_id:
          type: string
        item_id:
          type: string
        source_url:
          type: string
      required:
        - page
    CreateFeedbackRequest:
      type: object
      properties:
        message:
          type: string
          maxLength: 1000
        context:
          $ref: "#/components/schemas/FeedbackContext"
      required:
        - message
    FeedbackResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: __BASE_URL__/oauth/authorize
          tokenUrl: __BASE_URL__/oauth/token
          scopes:
            wishlist:read: Read wishlist data
            wishlist:write: Write wishlist data

security:
  - oauth2:
      - wishlist:read
      - wishlist:write

paths:
  /me:
    get:
      operationId: getMe
      summary: Validate current user access token
      security:
        - oauth2:
            - wishlist:read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized
  /items:
    post:
      operationId: createItem
      summary: Create or touch a wishlist item
      security:
        - oauth2:
            - wishlist:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateItemResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
    get:
      operationId: listItems
      summary: List wishlist items
      security:
        - oauth2:
            - wishlist:read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItemsResponse"
        "401":
          description: Unauthorized
  /feedback:
    post:
      operationId: createFeedback
      summary: Submit feedback
      security:
        - oauth2:
            - wishlist:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "429":
          description: Rate limited
